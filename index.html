<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Puter Frontier Studio</title>
  
  <!-- Puter.js SDK -->
  <script src="https://js.puter.com/v2/"></script>
  <!-- Markdown & Code Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    :root {
      --bg-base: #0c0d10;
      --bg-sidebar: #14171d;
      --bg-panel: #1b1f27;
      --bg-input: #171a21;
      --border: #282e3a;
      --border-focus: #4b5568;
      --accent: #60a5fa;
      --accent-muted: #1e3a5f;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --thought-bg: #11141a;
      --thought-border: #272d3b;
      --thought-text: #9ca3af;
      --danger: #ef4444;
      --user-bubble: #1f2532;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-base);
      color: var(--text-main);
      display: flex;
      height: 100dvh;
      overflow: hidden;
    }

    /* Sidebar Navigation */
    #sidebar {
      width: 300px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: absolute;
      top: 0; bottom: 0; left: -300px;
      z-index: 100;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #sidebar.open { transform: translateX(300px); }
    #sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(2px);
      z-index: 99;
    }
    #sidebar-overlay.open { display: block; }

    .sidebar-header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .new-chat-btn {
      margin: 12px 14px;
      padding: 12px;
      background: #252b38;
      color: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .chat-history-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .chat-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13.5px;
      color: var(--text-main);
      background: transparent;
      border: 1px solid transparent;
    }
    .chat-item:hover, .chat-item.active {
      background: var(--bg-panel);
      border-color: var(--border);
    }
    .chat-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .chat-del-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 6px;
      font-size: 14px;
    }
    .chat-del-btn:hover { color: var(--danger); }

    /* Main Content */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
    }

    /* Top Bar */
    header {
      height: 56px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: var(--bg-base);
      gap: 8px;
      z-index: 10;
    }
    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 20px;
      cursor: pointer;
      padding: 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .header-center {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      max-width: 440px;
    }
    select, input[type="text"], input[type="number"], textarea {
      background: var(--bg-panel);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
      width: 100%;
    }
    select optgroup {
      background: #14171d;
      color: var(--accent);
      font-style: normal;
      font-weight: 600;
    }
    select option {
      background: #1b1f27;
      color: var(--text-main);
    }
    .account-badge-btn {
      background: var(--accent-muted);
      color: var(--accent);
      border: 1px solid #254a7c;
      padding: 6px 10px;
      border-radius: 16px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Viewport */
    #chat-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .message-row {
      display: flex;
      flex-direction: column;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
    }
    .message-user {
      align-self: flex-end;
      background: var(--user-bubble);
      padding: 12px 16px;
      border-radius: 18px 18px 4px 18px;
      border: 1px solid var(--border);
      max-width: 88%;
      font-size: 15px;
      line-height: 1.5;
    }
    .message-assistant {
      align-self: flex-start;
      padding: 4px;
      font-size: 15px;
      line-height: 1.6;
      width: 100%;
    }

    /* Collapsible Thought Process Box (Anthropic / DeepSeek style) */
    .thought-container {
      margin-bottom: 12px;
      background: var(--thought-bg);
      border: 1px solid var(--thought-border);
      border-radius: 8px;
      overflow: hidden;
    }
    .thought-container summary {
      padding: 8px 12px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      display: inline-block;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .thought-content {
      padding: 10px 14px;
      font-size: 12.5px;
      color: var(--thought-text);
      font-family: ui-monospace, Menlo, Monaco, Consolas, monospace;
      white-space: pre-wrap;
      border-top: 1px solid var(--thought-border);
      max-height: 250px;
      overflow-y: auto;
      line-height: 1.45;
    }

    /* Markdown Styling */
    .message-assistant pre {
      background: #101216;
      padding: 14px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 10px 0;
      border: 1px solid var(--border);
      position: relative;
    }
    .message-assistant code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13.5px;
    }
    .copy-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      font-size: 11px;
      background: #252a36;
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 4px;
      padding: 3px 8px;
      cursor: pointer;
    }

    /* Attached files chip deck */
    #attachments-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 6px 16px 0;
      max-width: 860px;
      margin: 0 auto;
      width: 100%;
    }
    .file-chip {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 4px 10px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .file-chip button {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
    }

    /* Bottom Input Bar */
    #input-container {
      padding: 8px 12px calc(10px + env(safe-area-inset-bottom, 0px));
      background: var(--bg-base);
      border-top: 1px solid var(--border);
    }
    .input-box {
      max-width: 860px;
      margin: 0 auto;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 22px;
      display: flex;
      align-items: flex-end;
      padding: 6px 12px;
      gap: 8px;
    }
    .input-box:focus-within {
      border-color: var(--border-focus);
    }
    #prompt-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 15px;
      line-height: 1.4;
      resize: none;
      max-height: 180px;
      min-height: 24px;
      padding: 6px 0;
    }
    .send-btn {
      background: var(--accent);
      color: #0b0f19;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: bold;
      flex-shrink: 0;
      margin-bottom: 2px;
    }
    .send-btn.stop {
      background: var(--danger);
      color: #fff;
    }

    /* Settings & Reasoning Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: none; align-items: center; justify-content: center; z-index: 200;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--bg-sidebar); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px; width: 100%; max-width: 480px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .modal h3 { font-size: 16px; display: flex; align-items: center; justify-content: space-between; }
    .setting-group { display: flex; flex-direction: column; gap: 6px; }
    .setting-label { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
  </style>
</head>
<body>

  <!-- Overlay -->
  <div id="sidebar-overlay" onclick="toggleSidebar(false)"></div>

  <!-- Left Sidebar (Chats & Memory) -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <h2 style="font-size: 15px; font-weight: 700;">Conversations</h2>
      <button class="icon-btn" onclick="toggleSidebar(false)">✕</button>
    </div>
    <button class="new-chat-btn" onclick="startNewChat()">+ New Session</button>
    <div class="chat-history-list" id="chat-list"></div>
    <div style="padding: 12px; border-top: 1px solid var(--border); display: flex; gap: 6px;">
      <button class="icon-btn" style="flex:1; border: 1px solid var(--border); font-size: 11px;" onclick="exportAllChats()">Export JSON</button>
      <button class="icon-btn" style="flex:1; border: 1px solid var(--border); font-size: 11px;" onclick="document.getElementById('import-file').click()">Import JSON</button>
      <input type="file" id="import-file" style="display:none;" accept=".json" onchange="importChats(event)">
    </div>
  </aside>

  <!-- Main Chat Workspace -->
  <main id="main">
    <header>
      <button class="icon-btn" onclick="toggleSidebar(true)">☰</button>
      
      <!-- SOTA Model Selector -->
      <div class="header-center">
        <select id="model-select" onchange="onModelChange()">
          <!-- Google Gemini -->
          <optgroup label="Google DeepMind">
            <option value="google/gemini-4-argon">Gemini 4 Argon (Flagship)</option>
            <option value="google/gemini-3.8-flash">Gemini 3.8 Flash</option>
            <option value="google/gemini-3.7-flash">Gemini 3.7 Flash</option>
            <option value="google/gemini-nano-banana-2.1">Gemini Nano Banana 2.1</option>
          </optgroup>
          <!-- Anthropic Claude -->
          <optgroup label="Anthropic Claude">
            <option value="anthropic/claude-opus-5-5">Claude Opus 5.5</option>
            <option value="anthropic/claude-sonnet-5-5">Claude Sonnet 5.5</option>
            <option value="anthropic/claude-haiku-5-5">Claude Haiku 5.5</option>
            <option value="anthropic/claude-fable-5-1">Claude Fable 5.1</option>
            <option value="anthropic/claude-haiku-4-5">Claude Haiku 4.5</option>
          </optgroup>
          <!-- OpenAI -->
          <optgroup label="OpenAI">
            <option value="openai/gpt-6-astra-pro">GPT-6 Astra Pro</option>
            <option value="openai/gpt-6-astra">GPT-6 Astra</option>
            <option value="openai/gpt-6.1-sol-pro">GPT-6.1 Sol Pro</option>
            <option value="openai/gpt-6.1-sol">GPT-6.1 Sol</option>
            <option value="openai/gpt-6-sol-pro">GPT-6 Sol Pro</option>
            <option value="openai/gpt-6-sol">GPT-6 Sol</option>
            <option value="openai/gpt-6-luna-pro">GPT-6 Luna Pro</option>
            <option value="openai/gpt-6-luna">GPT-6 Luna</option>
          </optgroup>
          <!-- DeepSeek -->
          <optgroup label="DeepSeek">
            <option value="deepseek/deepseek-v4.1-flash">DeepSeek V4.1 Flash</option>
            <option value="deepseek/deepseek-v4-pro-0813">DeepSeek V4 Pro 0813</option>
            <option value="deepseek/deepseek-v4-flash-vision-exp">DeepSeek V4 Flash Vision Exp</option>
            <option value="deepseek/deepseek-v4-flash-0731">DeepSeek V4 Flash (0731)</option>
          </optgroup>
          <!-- Qwen -->
          <optgroup label="Qwen (Alibaba)">
            <option value="qwen/qwen3.6-max-preview">Qwen 3.6 Max Preview</option>
            <option value="qwen/qwen3.8-flash">Qwen 3.8 Flash</option>
            <option value="qwen/qwen3.6-flash">Qwen 3.6 Flash</option>
            <option value="qwen/qwen3.6-27b">Qwen 3.6 27B</option>
            <option value="qwen/qwen3.5-plus-20260420">Qwen 3.5 Plus</option>
          </optgroup>
          <!-- Z.ai GLM -->
          <optgroup label="Z.ai GLM">
            <option value="z-ai/glm-5.3-prime">GLM 5.3 Prime</option>
            <option value="z-ai/glm-5.3-flashx">GLM 5.3 FlashX</option>
            <option value="z-ai/glm-5.3-flash">GLM 5.3 Flash</option>
            <option value="z-ai/glm-5.3">GLM 5.3</option>
          </optgroup>
          <option value="custom">✎ Custom Model Slug...</option>
        </select>
        <input type="text" id="custom-model-input" placeholder="vendor/model-slug" style="display:none;" oninput="saveCurrentChatMeta()">
      </div>

      <!-- Settings & Reasoning Controls -->
      <button class="icon-btn" onclick="openSettingsModal()" title="Reasoning & Studio Settings">⚙️</button>

      <!-- Account Switcher -->
      <button class="account-badge-btn" id="account-btn" onclick="switchPuterAccount()" title="Change Google / Puter Account">
        <span id="account-name">Puter</span> ⇄
      </button>
    </header>

    <!-- Chat Messages Viewport -->
    <div id="chat-viewport"></div>

    <!-- Active Attachments Preview -->
    <div id="attachments-bar"></div>

    <!-- Footer Input Bar -->
    <div id="input-container">
      <div class="input-box">
        <input type="file" id="file-uploader" style="display:none;" multiple onchange="handleFileUpload(event)">
        <button class="icon-btn" style="color:var(--text-muted); padding:4px;" onclick="document.getElementById('file-uploader').click()" title="Attach Document or Image">📎</button>
        
        <textarea id="prompt-input" rows="1" placeholder="Ask anything, analyze documents, or code..." oninput="autoGrow(this)" onkeydown="handleKeyDown(event)"></textarea>
        
        <button class="send-btn" id="send-btn" onclick="handleSendAction()">▲</button>
      </div>
    </div>
  </main>

  <!-- Reasoning & Configuration Modal -->
  <div class="modal-backdrop" id="settings-modal" onclick="closeSettingsModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <h3>
        <span>Model & Reasoning Controls</span>
        <button class="icon-btn" onclick="closeSettingsModal()">✕</button>
      </h3>

      <div class="setting-group">
        <label class="setting-label">Reasoning Effort / Thinking Budget</label>
        <select id="reasoning-effort-select" onchange="updateSettings()">
          <option value="off">Off (No thinking tokens)</option>
          <option value="low">Low Effort (~1,024 tokens)</option>
          <option value="medium" selected>Medium Effort (~4,096 tokens)</option>
          <option value="high">High Effort (~16,384 tokens)</option>
          <option value="max">Max Reasoning (~32,768 tokens)</option>
        </select>
      </div>

      <div class="setting-group">
        <label class="setting-label">Temperature: <span id="temp-val">0.7</span></label>
        <input type="range" id="temp-range" min="0" max="1.5" step="0.05" value="0.7" oninput="document.getElementById('temp-val').innerText = this.value; updateSettings();">
      </div>

      <div class="setting-group">
        <label class="setting-label">System Instructions (Developer Prompt)</label>
        <textarea id="system-prompt" rows="3" placeholder="Define how the model should behave..." oninput="updateSettings()"></textarea>
      </div>

      <div class="setting-group">
        <label class="setting-label">Context Memory Pruning</label>
        <select id="prune-select" onchange="updateSettings()">
          <option value="all">Full Context History (Send Everything)</option>
          <option value="last_20">Rolling Window (Keep last 20 messages)</option>
          <option value="last_10">Lightweight Window (Keep last 10 messages)</option>
        </select>
      </div>

      <button class="new-chat-btn" style="margin: 6px 0 0;" onclick="closeSettingsModal()">Apply Configuration</button>
    </div>
  </div>

  <script>
    /* =========================================================
       LOCAL STATE PERSISTENCE (INDEPENDENT OF PUTER USER SESSIONS)
       ========================================================= */
    const STORAGE_KEY = "puter_frontier_studio_chats_v2";
    const SETTINGS_KEY = "puter_studio_settings_v2";

    let chats = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    let activeChatId = chats.length > 0 ? chats[0].id : null;
    let attachedFiles = [];
    let isStreaming = false;
    let abortController = null;

    let settings = JSON.parse(localStorage.getItem(SETTINGS_KEY) || JSON.stringify({
      reasoningEffort: "medium",
      temperature: 0.7,
      systemPrompt: "You are a state-of-the-art AI assistant. Reason deeply before answering complex queries.",
      contextMode: "all"
    }));

    window.addEventListener("DOMContentLoaded", async () => {
      loadSettingsUI();
      if (chats.length === 0) {
        startNewChat(false);
      } else {
        renderChatList();
        renderActiveChat();
      }
      await refreshPuterAuth();
    });

    function saveChats() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
      renderChatList();
    }

    function getActiveChat() {
      return chats.find(c => c.id === activeChatId) || chats[0];
    }

    /* =========================================================
       PUTER.JS CROSS-ACCOUNT AUTHENTICATION
       ========================================================= */
    async function refreshPuterAuth() {
      const btn = document.getElementById("account-name");
      try {
        if (puter.auth.isSignedIn()) {
          const user = await puter.auth.getUser();
          btn.innerText = "@" + (user.username || "Puter");
        } else {
          btn.innerText = "Connect Puter";
        }
      } catch (err) {
        btn.innerText = "Switch Account";
      }
    }

    // Force sign-in prompt: You can switch between 10 different Google accounts on Puter.
    // The active chat and previous turns will NOT be cleared.
    async function switchPuterAccount() {
      try {
        if (puter.auth.isSignedIn()) {
          await puter.auth.signOut();
        }
        await puter.auth.signIn({ request_auth: true });
        await refreshPuterAuth();
      } catch (e) {
        console.warn("Auth popup dismiss:", e);
        await refreshPuterAuth();
      }
    }

    /* =========================================================
       SETTINGS & MODAL
       ========================================================= */
    function openSettingsModal() { document.getElementById("settings-modal").classList.add("open"); }
    function closeSettingsModal(e) { 
      if (!e || e.target.id === "settings-modal" || e.target.closest("button")) {
        document.getElementById("settings-modal").classList.remove("open"); 
      }
    }

    function loadSettingsUI() {
      document.getElementById("reasoning-effort-select").value = settings.reasoningEffort || "medium";
      document.getElementById("temp-range").value = settings.temperature ?? 0.7;
      document.getElementById("temp-val").innerText = settings.temperature ?? 0.7;
      document.getElementById("system-prompt").value = settings.systemPrompt || "";
      document.getElementById("prune-select").value = settings.contextMode || "all";
    }

    function updateSettings() {
      settings.reasoningEffort = document.getElementById("reasoning-effort-select").value;
      settings.temperature = parseFloat(document.getElementById("temp-range").value);
      settings.systemPrompt = document.getElementById("system-prompt").value;
      settings.contextMode = document.getElementById("prune-select").value;
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
    }

    /* =========================================================
       CHAT WORKSPACE MANAGEMENT
       ========================================================= */
    function startNewChat(render = true) {
      const newChat = {
        id: "chat_" + Date.now(),
        title: "New Session",
        model: document.getElementById("model-select").value || "google/gemini-4-argon",
        customModel: "",
        messages: [],
        createdAt: new Date().toISOString()
      };
      chats.unshift(newChat);
      activeChatId = newChat.id;
      saveChats();
      if (render) {
        renderActiveChat();
        toggleSidebar(false);
      }
    }

    function selectChat(id) {
      activeChatId = id;
      renderChatList();
      renderActiveChat();
      toggleSidebar(false);
    }

    function deleteChat(e, id) {
      e.stopPropagation();
      if (!confirm("Delete this conversation?")) return;
      chats = chats.filter(c => c.id !== id);
      if (activeChatId === id) {
        activeChatId = chats.length > 0 ? chats[0].id : null;
      }
      if (!activeChatId) startNewChat(false);
      saveChats();
      renderActiveChat();
    }

    function renderChatList() {
      const container = document.getElementById("chat-list");
      container.innerHTML = chats.map(c => `
        <div class="chat-item ${c.id === activeChatId ? 'active' : ''}" onclick="selectChat('${c.id}')">
          <span class="chat-title">${escapeHTML(c.title || "Untitled")}</span>
          <button class="chat-del-btn" onclick="deleteChat(event, '${c.id}')">✕</button>
        </div>
      `).join('');
    }

    function renderActiveChat() {
      const chat = getActiveChat();
      if (!chat) return;

      const modelSelect = document.getElementById("model-select");
      const customInput = document.getElementById("custom-model-input");

      const exists = Array.from(modelSelect.options).some(o => o.value === chat.model);
      if (exists && chat.model !== "custom") {
        modelSelect.value = chat.model;
        customInput.style.display = "none";
      } else {
        modelSelect.value = "custom";
        customInput.value = chat.customModel || chat.model;
        customInput.style.display = "block";
      }

      const viewport = document.getElementById("chat-viewport");
      viewport.innerHTML = "";
      chat.messages.forEach(msg => {
        appendMessageDOM(msg.role, msg.content, msg.thinking || "", false);
      });
      viewport.scrollTop = viewport.scrollHeight;
    }

    function onModelChange() {
      const modelSelect = document.getElementById("model-select");
      const customInput = document.getElementById("custom-model-input");
      if (modelSelect.value === "custom") {
        customInput.style.display = "block";
        customInput.focus();
      } else {
        customInput.style.display = "none";
      }
      saveCurrentChatMeta();
    }

    function saveCurrentChatMeta() {
      const chat = getActiveChat();
      if (!chat) return;
      const modelSelect = document.getElementById("model-select");
      const customInput = document.getElementById("custom-model-input");
      chat.model = modelSelect.value === "custom" ? (customInput.value.trim() || "google/gemini-4-argon") : modelSelect.value;
      chat.customModel = customInput.value.trim();
      saveChats();
    }

    function toggleSidebar(force) {
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("sidebar-overlay");
      const open = force !== undefined ? force : !sidebar.classList.contains("open");
      sidebar.classList.toggle("open", open);
      overlay.classList.toggle("open", open);
    }

    /* =========================================================
       DOCUMENT & VISION INGESTION (ANTHROPIC XML PATTERNS)
       ========================================================= */
    async function handleFileUpload(event) {
      const files = Array.from(event.target.files);
      for (const file of files) {
        const isText = file.type.startsWith("text/") || 
                       file.name.match(/\.(txt|md|py|js|ts|json|csv|html|css|yaml|yml|sh|c|cpp|rs|java|rb|sql|xml)$/i);
        if (isText) {
          const content = await file.text();
          attachedFiles.push({ name: file.name, content, type: "document" });
        } else {
          const b64 = await fileToBase64(file);
          attachedFiles.push({ name: file.name, content: b64, type: "media" });
        }
      }
      event.target.value = "";
      renderAttachments();
    }

    function fileToBase64(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.readAsDataURL(file);
      });
    }

    function renderAttachments() {
      const container = document.getElementById("attachments-bar");
      container.innerHTML = attachedFiles.map((file, idx) => `
        <div class="file-chip">
          <span>${file.type === "media" ? '🖼️' : '📄'} ${escapeHTML(file.name)}</span>
          <button onclick="removeAttachment(${idx})">✕</button>
        </div>
      `).join('');
    }

    function removeAttachment(index) {
      attachedFiles.splice(index, 1);
      renderAttachments();
    }

    /* =========================================================
       STREAMING, THINKING EXTRACTION, & PUTER CALL
       ========================================================= */
    function autoGrow(el) {
      el.style.height = "auto";
      el.style.height = el.scrollHeight + "px";
    }

    function handleKeyDown(e) {
      if (e.key === "Enter" && !e.shiftKey && window.innerWidth > 640) {
        e.preventDefault();
        handleSendAction();
      }
    }

    function handleSendAction() {
      if (isStreaming) {
        if (abortController) abortController.abort();
        setStreamingUI(false);
        return;
      }
      sendMessage();
    }

    function setStreamingUI(streaming) {
      isStreaming = streaming;
      const sendBtn = document.getElementById("send-btn");
      if (streaming) {
        sendBtn.innerHTML = "■";
        sendBtn.classList.add("stop");
      } else {
        sendBtn.innerHTML = "▲";
        sendBtn.classList.remove("stop");
      }
    }

    // Thinking parser: Handles <think> tags, unclosed streaming tags, or separated reasoning
    function parseThinkingAndAnswer(raw) {
      let thinking = "";
      let answer = raw;

      if (raw.includes("<think>")) {
        const parts = raw.split("<think>");
        const afterThink = parts.slice(1).join("<think>");
        if (afterThink.includes("</think>")) {
          const splitEnd = afterThink.split("</think>");
          thinking = splitEnd[0];
          answer = (parts[0] + splitEnd.slice(1).join("</think>")).trim();
        } else {
          // Still in the process of thinking
          thinking = afterThink;
          answer = parts[0].trim();
        }
      }
      return { thinking: thinking.trim(), answer };
    }

    async function sendMessage() {
      const inputEl = document.getElementById("prompt-input");
      const userText = inputEl.value.trim();
      if (!userText && attachedFiles.length === 0) return;

      const chat = getActiveChat();
      if (!chat) return;

      // Ingest attached documents using Anthropic-standard XML tags for high LLM parsing accuracy
      let finalPrompt = userText;
      if (attachedFiles.length > 0) {
        const docsXML = attachedFiles.map(f => {
          if (f.type === "document") {
            return `<document filename="${escapeHTML(f.name)}">\n${f.content}\n</document>`;
          } else {
            return `[Attached Media: ${escapeHTML(f.name)} | Data URI: ${f.content}]`;
          }
        }).join("\n\n");
        finalPrompt = docsXML + "\n\n" + (userText || "Analyze the attached document(s).");
      }

      chat.messages.push({ role: "user", content: finalPrompt });
      if (chat.messages.length === 1) {
        chat.title = userText.slice(0, 32) || attachedFiles[0]?.name || "New Session";
      }

      inputEl.value = "";
      inputEl.style.height = "auto";
      attachedFiles = [];
      renderAttachments();
      saveChats();

      appendMessageDOM("user", finalPrompt);

      saveCurrentChatMeta();
      const modelToUse = chat.model;

      // Prepare UI for Assistant Streaming response
      const domElements = appendMessageDOM("assistant", "", "", true);
      setStreamingUI(true);

      abortController = new AbortController();
      const startTime = Date.now();

      try {
        // Build full message payload (including System Prompt & Context Pruning)
        let contextMessages = [...chat.messages];
        if (settings.contextMode === "last_20") {
          contextMessages = contextMessages.slice(-20);
        } else if (settings.contextMode === "last_10") {
          contextMessages = contextMessages.slice(-10);
        }

        const messagesPayload = [];
        if (settings.systemPrompt && settings.systemPrompt.trim()) {
          messagesPayload.push({ role: "system", content: settings.systemPrompt.trim() });
        }
        contextMessages.forEach(m => messagesPayload.push({ role: m.role, content: m.content }));

        // Map Reasoning controls to SOTA options
        const options = {
          model: modelToUse,
          stream: true,
          temperature: settings.temperature,
          signal: abortController.signal
        };

        if (settings.reasoningEffort !== "off") {
          options.reasoning_effort = settings.reasoningEffort; // low, medium, high
          const tokenBudgets = { low: 1024, medium: 4096, high: 16384, max: 32768 };
          options.thinking = {
            type: "enabled",
            budget_tokens: tokenBudgets[settings.reasoningEffort] || 4096
          };
        }

        // Invoke Puter AI
        const response = await puter.ai.chat(messagesPayload, options);
        let accumulatedRaw = "";

        if (response && response[Symbol.asyncIterator]) {
          for await (const chunk of response) {
            // Support both direct chunk text & separated reasoning delta if provided
            if (chunk?.reasoning_content) {
              accumulatedRaw = `<think>${chunk.reasoning_content}</think>` + (chunk?.text || "");
            } else if (chunk?.text) {
              accumulatedRaw += chunk.text;
            } else if (typeof chunk === "string") {
              accumulatedRaw += chunk;
            }

            const { thinking, answer } = parseThinkingAndAnswer(accumulatedRaw);
            const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);

            // Update Thought block
            if (thinking) {
              domElements.thoughtBlock.style.display = "block";
              domElements.thoughtTimer.innerText = `${elapsed}s`;
              domElements.thoughtContent.innerText = thinking;
            }

            // Update Answer block
            if (answer) {
              domElements.answerContent.innerHTML = renderMarkdown(answer);
            }
            scrollToBottom();
          }
        } else {
          accumulatedRaw = response?.message?.content || (typeof response === "string" ? response : JSON.stringify(response));
          const { thinking, answer } = parseThinkingAndAnswer(accumulatedRaw);
          if (thinking) {
            domElements.thoughtBlock.style.display = "block";
            domElements.thoughtContent.innerText = thinking;
          }
          domElements.answerContent.innerHTML = renderMarkdown(answer || accumulatedRaw);
        }

        // Finalize state
        const totalDuration = ((Date.now() - startTime) / 1000).toFixed(1);
        domElements.thoughtTimer.innerText = `Thought for ${totalDuration}s`;
        if (domElements.pulseDot) domElements.pulseDot.remove();
        domElements.thoughtBlock.removeAttribute("open"); // Collapse reasoning cleanly

        const parsed = parseThinkingAndAnswer(accumulatedRaw);
        chat.messages.push({
          role: "assistant",
          content: parsed.answer || accumulatedRaw,
          thinking: parsed.thinking
        });
        saveChats();

      } catch (err) {
        if (err.name === "AbortError") {
          domElements.answerContent.innerHTML += `<p style='color:var(--danger);font-size:12px;margin-top:6px;'>[Stopped by user]</p>`;
        } else {
          console.error("Puter Error:", err);
          domElements.answerContent.innerHTML = `<span style="color:var(--danger)">Error: ${escapeHTML(err.message || String(err))}</span>`;
        }
      } finally {
        setStreamingUI(false);
        attachCodeCopyButtons();
      }
    }

    /* =========================================================
       DOM CREATION & MARKDOWN ENGINE
       ========================================================= */
    function appendMessageDOM(role, content, thinking = "", isLive = false) {
      const viewport = document.getElementById("chat-viewport");
      const row = document.createElement("div");
      row.className = "message-row";

      if (role === "user") {
        row.innerHTML = `<div class="message-user">${escapeHTML(content).replace(/\n/g, '<br>')}</div>`;
        viewport.appendChild(row);
        scrollToBottom();
        return null;
      }

      // Assistant Message
      row.innerHTML = `
        <div style="font-size:11.5px; color:var(--text-muted); margin-bottom: 4px;">✦ Assistant</div>
        <div class="message-assistant">
          <details class="thought-container" ${thinking || isLive ? 'open' : ''} style="${thinking || isLive ? '' : 'display:none;'}">
            <summary>
              ${isLive ? '<span class="pulse-dot"></span>' : ''}
              <span class="thought-timer-label">Thinking Process</span>
              <span class="thought-timer" style="margin-left:auto; font-size:11px; color:var(--text-muted);"></span>
            </summary>
            <div class="thought-content">${escapeHTML(thinking)}</div>
          </details>
          <div class="answer-content">${content ? renderMarkdown(content) : (isLive ? '<span style="color:var(--text-muted)">Thinking...</span>' : '')}</div>
        </div>
      `;

      viewport.appendChild(row);
      scrollToBottom();

      return {
        thoughtBlock: row.querySelector(".thought-container"),
        thoughtContent: row.querySelector(".thought-content"),
        thoughtTimer: row.querySelector(".thought-timer"),
        pulseDot: row.querySelector(".pulse-dot"),
        answerContent: row.querySelector(".answer-content")
      };
    }

    function renderMarkdown(rawText) {
      marked.setOptions({
        highlight: function(code, lang) {
          if (lang && hljs.getLanguage(lang)) {
            return hljs.highlight(code, { language: lang }).value;
          }
          return hljs.highlightAuto(code).value;
        },
        breaks: true
      });
      return marked.parse(rawText);
    }

    function attachCodeCopyButtons() {
      document.querySelectorAll(".message-assistant pre").forEach((pre) => {
        if (pre.querySelector(".copy-btn")) return;
        const btn = document.createElement("button");
        btn.className = "copy-btn";
        btn.innerText = "Copy";
        btn.onclick = () => {
          const code = pre.querySelector("code")?.innerText || pre.innerText;
          navigator.clipboard.writeText(code);
          btn.innerText = "Copied!";
          setTimeout(() => btn.innerText = "Copy", 1500);
        };
        pre.appendChild(btn);
      });
    }

    function scrollToBottom() {
      const vp = document.getElementById("chat-viewport");
      vp.scrollTop = vp.scrollHeight;
    }

    function escapeHTML(str) {
      return (str || "").replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }

    /* =========================================================
       IMPORT / EXPORT (BACKUP DATA)
       ========================================================= */
    function exportAllChats() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(chats, null, 2));
      const a = document.createElement("a");
      a.href = dataStr;
      a.download = `frontier_studio_backup_${Date.now()}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function importChats(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (Array.isArray(imported)) {
            chats = imported;
            activeChatId = chats[0]?.id || null;
            saveChats();
            renderActiveChat();
            alert("Chats restored successfully!");
          }
        } catch(err) {
          alert("Invalid backup JSON format.");
        }
      };
      reader.readAsText(file);
    }
  </script>
</body>
